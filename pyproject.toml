[project]
name = "workbench"
version = "0.1.0"
description = "LLM tool-use evaluation benchmark"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26,<2",
    "openai>=1.0",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "seaborn>=0.13",
    "tenacity>=9.1.4",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.1",
    "pre-commit>=4.5.1",
    "pyright>=1.1.390",
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
workbench-inference = "src.cli:inference"
workbench-evaluate = "src.cli:evaluate"
workbench-generate-data = "src.cli:generate_data"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["I", "UP", "F", "E", "W", "N", "SIM", "ANN"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN2"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
